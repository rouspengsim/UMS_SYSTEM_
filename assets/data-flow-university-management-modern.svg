<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Modern Data Flow - University Management System</title>
  <desc id="desc">Modern slide-ready data flow diagram for a University Management System.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7faf6"/>
      <stop offset="0.48" stop-color="#eef6f0"/>
      <stop offset="1" stop-color="#fff7ef"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#16352d" flood-opacity="0.13"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16352d" flood-opacity="0.11"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#f97316"/>
    </marker>
    <style>
      .title { font: 800 58px Arial, sans-serif; fill: #12211c; letter-spacing: 0; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #64746d; }
      .section { font: 800 18px Arial, sans-serif; fill: #ffffff; letter-spacing: 1.4px; }
      .card-title { font: 800 29px Arial, sans-serif; fill: #12211c; text-anchor: middle; }
      .card-text { font: 500 19px Arial, sans-serif; fill: #5b6b64; text-anchor: middle; }
      .small-label { font: 700 17px Arial, sans-serif; fill: #56665f; text-anchor: middle; }
      .pill-text { font: 700 17px Arial, sans-serif; fill: #173b2f; text-anchor: middle; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 6; stroke-linecap: round; marker-end: url(#arrowBlue); }
      .flow2 { fill: none; stroke: #f97316; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowOrange); }
      .card { fill: #ffffff; stroke: #d8e4dc; stroke-width: 2; filter: url(#shadow); }
      .mini { fill: #ffffff; stroke: #e1e8e2; stroke-width: 2; filter: url(#softShadow); }
      .iconCircle { fill: #eef8f7; stroke: #b8ddd8; stroke-width: 2; }
      .iconText { font: 800 28px Arial, sans-serif; fill: #0f766e; text-anchor: middle; }
      .mutedLine { stroke: #d3e1d9; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="80" r="170" fill="#dff0e5" opacity="0.55"/>
  <circle cx="116" cy="805" r="220" fill="#ffe4cf" opacity="0.45"/>
  <path d="M1280 810 C1400 690 1475 585 1545 398" fill="none" stroke="#cddfd5" stroke-width="5" opacity="0.55"/>
  <path d="M50 145 C185 95 285 105 390 160" fill="none" stroke="#d8e8dd" stroke-width="5" opacity="0.65"/>

  <text class="title" x="95" y="94">Data Flow</text>
  <text class="subtitle" x="99" y="130">University Management System</text>
  <rect x="100" y="155" width="210" height="8" rx="4" fill="url(#accent)"/>

  <rect x="1110" y="72" width="380" height="72" rx="36" fill="#ffffff" stroke="#d8e4dc" stroke-width="2" filter="url(#softShadow)"/>
  <text class="pill-text" x="1300" y="116">Admin • Teacher • Student</text>

  <rect x="95" y="230" width="300" height="350" rx="28" class="card"/>
  <rect x="95" y="230" width="300" height="62" rx="28" fill="url(#primary)"/>
  <text class="section" x="245" y="270" text-anchor="middle">USERS</text>

  <rect x="132" y="325" width="226" height="58" rx="18" class="mini"/>
  <circle cx="165" cy="354" r="18" class="iconCircle"/>
  <text class="iconText" x="165" y="364">A</text>
  <text class="pill-text" x="252" y="361">Admin</text>

  <rect x="132" y="411" width="226" height="58" rx="18" class="mini"/>
  <circle cx="165" cy="440" r="18" class="iconCircle"/>
  <text class="iconText" x="165" y="450">T</text>
  <text class="pill-text" x="252" y="447">Teacher</text>

  <rect x="132" y="497" width="226" height="58" rx="18" class="mini"/>
  <circle cx="165" cy="526" r="18" class="iconCircle"/>
  <text class="iconText" x="165" y="536">S</text>
  <text class="pill-text" x="252" y="533">Student</text>

  <rect x="500" y="276" width="290" height="255" rx="32" class="card"/>
  <circle cx="645" cy="346" r="40" fill="#eaf2ff" stroke="#c7d8ff" stroke-width="2"/>
  <text class="iconText" x="645" y="357" fill="#2563eb">WEB</text>
  <text class="card-title" x="645" y="424">Web Application</text>
  <text class="card-text" x="645" y="462">Input and view data</text>
  <line class="mutedLine" x1="555" y1="488" x2="735" y2="488"/>
  <text class="small-label" x="645" y="516">React • TanStack Start</text>

  <rect x="905" y="205" width="270" height="185" rx="30" class="card"/>
  <circle cx="1040" cy="270" r="38" fill="#fff4e8" stroke="#ffd1a8" stroke-width="2"/>
  <text class="iconText" x="1040" y="280" fill="#f97316">AUTH</text>
  <text class="card-title" x="1040" y="334">Authentication</text>
  <text class="card-text" x="1040" y="365">Check user role</text>

  <rect x="905" y="505" width="270" height="185" rx="30" class="card"/>
  <circle cx="1040" cy="570" r="38" fill="#ecfdf5" stroke="#bcebd0" stroke-width="2"/>
  <text class="iconText" x="1040" y="580" fill="#16a34a">DB</text>
  <text class="card-title" x="1040" y="634">Supabase</text>
  <text class="card-text" x="1040" y="665">Database services</text>

  <rect x="1275" y="315" width="250" height="300" rx="32" class="card"/>
  <rect x="1275" y="315" width="250" height="62" rx="32" fill="url(#accent)"/>
  <text class="section" x="1400" y="355" text-anchor="middle">OUTPUT</text>
  <text class="card-title" x="1400" y="441">Result</text>
  <text class="card-text" x="1400" y="482">Dashboard</text>
  <text class="card-text" x="1400" y="516">Report</text>
  <text class="card-text" x="1400" y="550">Notification</text>

  <path class="flow" d="M395 405 H480"/>
  <path class="flow" d="M790 405 C850 405 845 298 902 298"/>
  <path class="flow2" d="M1040 390 V492"/>
  <path class="flow" d="M1175 598 C1225 598 1230 466 1270 466"/>

  <path class="flow2" d="M1275 555 C1135 785 650 800 390 570"/>
  <text class="small-label" x="815" y="790">Stored data is processed and displayed back to each user by permission</text>

  <rect x="500" y="620" width="290" height="98" rx="24" fill="#ffffff" stroke="#d8e4dc" stroke-width="2" filter="url(#softShadow)"/>
  <text class="small-label" x="645" y="658">Main Data</text>
  <text class="card-text" x="645" y="691">Students • Teachers • Scores</text>

  <path class="flow2" d="M645 532 V616"/>
  <path class="flow2" d="M790 670 H902"/>
</svg>
