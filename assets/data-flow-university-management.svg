<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">University Management System Data Flow</title>
  <desc id="desc">Data flow diagram for a university management system showing users, web application, authentication, Supabase database, and results.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#8f2b15"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f6f8ed; }
      .pattern { fill: none; stroke: #c7d3ad; stroke-width: 2; opacity: 0.35; }
      .title { font: 700 46px Arial, sans-serif; fill: #173b2f; }
      .subtitle { font: 500 24px Arial, sans-serif; fill: #5c665b; }
      .box { fill: #ffffff; stroke: #cbd7b7; stroke-width: 3; rx: 24; filter: url(#shadow); }
      .box-accent { fill: #fff8f0; stroke: #b54824; stroke-width: 3; rx: 24; filter: url(#shadow); }
      .label { font: 700 28px Arial, sans-serif; fill: #1e2f27; text-anchor: middle; }
      .small { font: 500 20px Arial, sans-serif; fill: #586257; text-anchor: middle; }
      .arrow { fill: none; stroke: #8f2b15; stroke-width: 6; marker-end: url(#arrow); }
      .icon { font: 700 42px Arial, sans-serif; fill: #8f2b15; text-anchor: middle; }
      .badge { fill: #8f2b15; }
      .badge-text { font: 700 22px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <path class="pattern" d="M30 760 C180 620, 130 420, 250 250 C340 120, 520 120, 610 210"/>
  <path class="pattern" d="M1380 80 C1260 250, 1330 420, 1190 600 C1090 735, 900 780, 760 710"/>
  <path class="pattern" d="M1460 80 C1345 260, 1420 500, 1300 760"/>

  <text class="title" x="800" y="90" text-anchor="middle">Data Flow</text>
  <text class="subtitle" x="800" y="128" text-anchor="middle">University Management System</text>

  <rect class="box" x="90" y="265" width="300" height="260"/>
  <text class="icon" x="240" y="328">USER</text>
  <text class="label" x="240" y="390">Users</text>
  <text class="small" x="240" y="430">Admin</text>
  <text class="small" x="240" y="462">Teacher</text>
  <text class="small" x="240" y="494">Student</text>

  <path class="arrow" d="M405 395 H535"/>

  <rect class="box-accent" x="550" y="275" width="285" height="240"/>
  <text class="icon" x="692" y="340">WEB</text>
  <text class="label" x="692" y="398">Web Application</text>
  <text class="small" x="692" y="438">Input data</text>
  <text class="small" x="692" y="470">View information</text>

  <path class="arrow" d="M850 395 H980"/>

  <rect class="box" x="995" y="185" width="250" height="150"/>
  <text class="icon" x="1120" y="242">AUTH</text>
  <text class="label" x="1120" y="292">Authentication</text>

  <path class="arrow" d="M1120 350 V442"/>

  <rect class="box-accent" x="995" y="455" width="250" height="170"/>
  <text class="icon" x="1120" y="515">DB</text>
  <text class="label" x="1120" y="565">Supabase</text>
  <text class="small" x="1120" y="600">Database</text>

  <path class="arrow" d="M1258 540 H1390"/>

  <rect class="box" x="1405" y="390" width="120" height="300"/>
  <text class="icon" x="1465" y="468">OUT</text>
  <text class="label" x="1465" y="532">Result</text>
  <text class="small" x="1465" y="570">Report</text>
  <text class="small" x="1465" y="602">Dashboard</text>

  <path class="arrow" d="M1405 625 C1010 790, 630 760, 355 530"/>

  <rect class="badge" x="555" y="710" width="490" height="58" rx="29"/>
  <text class="badge-text" x="800" y="747">Data is stored, processed, and displayed back to users</text>
</svg>
