<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Modern User Permission Table</title>
  <desc id="desc">Modern user permission table for a University Management System presentation slide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="0.55" stop-color="#eef7f3"/>
      <stop offset="1" stop-color="#fff6ee"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#12211c" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#12211c" flood-opacity="0.1"/>
    </filter>
    <style>
      .title { font: 800 58px Arial, sans-serif; fill: #12211c; letter-spacing: 0; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #61726a; }
      .card { fill: #ffffff; stroke: #dce8e0; stroke-width: 2; filter: url(#shadow); }
      .headerText { font: 800 22px Arial, sans-serif; fill: #ffffff; }
      .cell { font: 700 21px Arial, sans-serif; fill: #17251f; }
      .muted { font: 600 20px Arial, sans-serif; fill: #5e7068; }
      .idText { font: 800 22px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .badgeText { font: 800 16px Arial, sans-serif; text-anchor: middle; }
      .footer { font: 700 18px Arial, sans-serif; fill: #43534c; text-anchor: middle; }
      .line { stroke: #e4ece6; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1418" cy="92" r="190" fill="#dff0e5" opacity="0.52"/>
  <circle cx="86" cy="812" r="235" fill="#ffe4cf" opacity="0.5"/>
  <path d="M1280 820 C1405 682 1482 538 1540 338" fill="none" stroke="#cbded3" stroke-width="5" opacity="0.55"/>
  <path d="M58 152 C185 96 308 112 420 178" fill="none" stroke="#d7e8dc" stroke-width="5" opacity="0.7"/>

  <text class="title" x="96" y="92">User Permission</text>
  <text class="subtitle" x="100" y="130">University Management System</text>
  <rect x="101" y="155" width="285" height="8" rx="4" fill="url(#accent)"/>

  <rect x="1110" y="70" width="380" height="72" rx="36" fill="#fff" stroke="#dce8e0" stroke-width="2" filter="url(#softShadow)"/>
  <text class="footer" x="1300" y="115">Modern Account &amp; Role Table</text>

  <rect class="card" x="82" y="222" width="1436" height="575" rx="30"/>
  <rect x="82" y="222" width="1436" height="74" rx="30" fill="url(#header)"/>
  <rect x="82" y="260" width="1436" height="36" fill="url(#header)"/>

  <text class="headerText" x="132" y="268">ID</text>
  <text class="headerText" x="220" y="268">User Name</text>
  <text class="headerText" x="498" y="268">Email</text>
  <text class="headerText" x="822" y="268">Password</text>
  <text class="headerText" x="1038" y="268">Role</text>
  <text class="headerText" x="1242" y="268">Permission</text>

  <line class="line" x1="182" y1="296" x2="182" y2="797"/>
  <line class="line" x1="448" y1="296" x2="448" y2="797"/>
  <line class="line" x1="770" y1="296" x2="770" y2="797"/>
  <line class="line" x1="1000" y1="296" x2="1000" y2="797"/>
  <line class="line" x1="1190" y1="296" x2="1190" y2="797"/>

  <g>
    <rect x="102" y="320" width="1396" height="54" rx="18" fill="#f8fbf8"/>
    <circle cx="132" cy="347" r="20" fill="#0f766e"/>
    <text class="idText" x="132" y="355">1</text>
    <text class="cell" x="220" y="355">SOPHAL</text>
    <text class="muted" x="498" y="355">admin@gmail.com</text>
    <text class="muted" x="822" y="355">********</text>
    <rect x="1030" y="326" width="104" height="40" rx="20" fill="#e9f7f5"/>
    <text class="badgeText" x="1082" y="352" fill="#0f766e">Admin</text>
    <text class="muted" x="1242" y="355">Full system control</text>

    <rect x="102" y="386" width="1396" height="54" rx="18" fill="#ffffff"/>
    <circle cx="132" cy="413" r="20" fill="#2563eb"/>
    <text class="idText" x="132" y="421">2</text>
    <text class="cell" x="220" y="421">TEACHER_A</text>
    <text class="muted" x="498" y="421">teacher_a@gmail.com</text>
    <text class="muted" x="822" y="421">********</text>
    <rect x="1022" y="392" width="120" height="40" rx="20" fill="#eef2ff"/>
    <text class="badgeText" x="1082" y="418" fill="#2563eb">Teacher</text>
    <text class="muted" x="1242" y="421">Attendance and scores</text>

    <rect x="102" y="452" width="1396" height="54" rx="18" fill="#f8fbf8"/>
    <circle cx="132" cy="479" r="20" fill="#2563eb"/>
    <text class="idText" x="132" y="487">3</text>
    <text class="cell" x="220" y="487">TEACHER_B</text>
    <text class="muted" x="498" y="487">teacher_b@gmail.com</text>
    <text class="muted" x="822" y="487">********</text>
    <rect x="1022" y="458" width="120" height="40" rx="20" fill="#eef2ff"/>
    <text class="badgeText" x="1082" y="484" fill="#2563eb">Teacher</text>
    <text class="muted" x="1242" y="487">Classes and reports</text>

    <rect x="102" y="518" width="1396" height="54" rx="18" fill="#ffffff"/>
    <circle cx="132" cy="545" r="20" fill="#2563eb"/>
    <text class="idText" x="132" y="553">4</text>
    <text class="cell" x="220" y="553">TEACHER_C</text>
    <text class="muted" x="498" y="553">teacher_c@gmail.com</text>
    <text class="muted" x="822" y="553">********</text>
    <rect x="1022" y="524" width="120" height="40" rx="20" fill="#eef2ff"/>
    <text class="badgeText" x="1082" y="550" fill="#2563eb">Teacher</text>
    <text class="muted" x="1242" y="553">Subjects and students</text>

    <rect x="102" y="584" width="1396" height="54" rx="18" fill="#f8fbf8"/>
    <circle cx="132" cy="611" r="20" fill="#f97316"/>
    <text class="idText" x="132" y="619">5</text>
    <text class="cell" x="220" y="619">STUDENT_1</text>
    <text class="muted" x="498" y="619">student_1@gmail.com</text>
    <text class="muted" x="822" y="619">********</text>
    <rect x="1024" y="590" width="116" height="40" rx="20" fill="#fff3e8"/>
    <text class="badgeText" x="1082" y="616" fill="#ea580c">Student</text>
    <text class="muted" x="1242" y="619">View profile and results</text>

    <rect x="102" y="650" width="1396" height="54" rx="18" fill="#ffffff"/>
    <circle cx="132" cy="677" r="20" fill="#f97316"/>
    <text class="idText" x="132" y="685">6</text>
    <text class="cell" x="220" y="685">STUDENT_2</text>
    <text class="muted" x="498" y="685">student_2@gmail.com</text>
    <text class="muted" x="822" y="685">********</text>
    <rect x="1024" y="656" width="116" height="40" rx="20" fill="#fff3e8"/>
    <text class="badgeText" x="1082" y="682" fill="#ea580c">Student</text>
    <text class="muted" x="1242" y="685">View attendance and payment</text>

    <rect x="102" y="716" width="1396" height="54" rx="18" fill="#f8fbf8"/>
    <circle cx="132" cy="743" r="20" fill="#16a34a"/>
    <text class="idText" x="132" y="751">7</text>
    <text class="cell" x="220" y="751">ACCOUNTING</text>
    <text class="muted" x="498" y="751">accounting@gmail.com</text>
    <text class="muted" x="822" y="751">********</text>
    <rect x="1012" y="722" width="140" height="40" rx="20" fill="#ecfdf5"/>
    <text class="badgeText" x="1082" y="748" fill="#16a34a">Accounting</text>
    <text class="muted" x="1242" y="751">Payments and reports</text>
  </g>

  <rect x="412" y="825" width="776" height="48" rx="24" fill="#ffffff" stroke="#dce8e0" stroke-width="2" filter="url(#softShadow)"/>
  <text class="footer" x="800" y="856">Passwords are hidden in presentation for better security.</text>
</svg>
